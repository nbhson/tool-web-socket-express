name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Chạy node:test
        run: npm test
      - name: Smoke test
        run: npm run smoke
